[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notui"
version = "0.1.2"
description = "Keyboard-first local SQLite note TUI"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Pascal Rothe" }]
dependencies = [
  "platformdirs>=4.2",
  "textual>=0.80",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
notui = "notui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
